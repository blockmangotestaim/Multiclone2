pluginManagement {
    repositories { google(); mavenCentral(); gradlePluginPortal() }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}
rootProject.name = 'MultiClone'
include ':app'

// Generated by scripts/link-engine.sh (run by the GitHub workflow).
// It wires the cloned engine repo's library modules into this build.
if (file('engine-modules.gradle').exists()) {
    apply from: 'engine-modules.gradle'
}
