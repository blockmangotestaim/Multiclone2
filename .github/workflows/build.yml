name: Build Debug APK

on:
  workflow_dispatch:
    inputs:
      jdk_version:
        description: 'JDK version (AGP 8.5 needs 17+)'
        type: choice
        default: '17'
        options: ['17', '21']
      engine_repo:
        description: 'Engine repository (owner/name)'
        type: string
        default: 'ALEX5402/NewBlackbox'
      engine_ref:
        description: 'Engine branch, tag or commit'
        type: string
        default: 'main'
      engine_module:
        description: 'Engine Gradle library module name'
        type: string
        default: 'Bcore'
      ndk_version:
        description: 'NDK version required by the engine'
        type: string
        default: '29.0.13846066'
      gradle_version:
        description: 'Gradle version'
        type: string
        default: '8.9'
      target_sdk:
        description: 'targetSdkVersion (28 or lower = best compatibility)'
        type: string
        default: '28'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.jdk_version }}

      - name: Install SDK / NDK packages
        run: |
          SDKM="$(command -v sdkmanager || true)"
          [ -z "$SDKM" ] && SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | tail -1)"
          echo "Using $SDKM"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" \
                  "ndk;${{ inputs.ndk_version }}" "cmake;3.22.1"

      - name: Fetch engine
        run: |
          git clone --recursive https://github.com/${{ inputs.engine_repo }} engine
          git -C engine checkout "${{ inputs.engine_ref }}"
          git -C engine submodule update --init --recursive
          ./scripts/link-engine.sh engine "${{ inputs.engine_module }}"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ inputs.gradle_version }}

      - name: Build debug APK
        run: >
          gradle :app:assembleDebug --stacktrace --no-daemon
          -PengineModule=${{ inputs.engine_module }}
          -PndkVersion=${{ inputs.ndk_version }}
          -PtargetSdk=${{ inputs.target_sdk }}

      - uses: actions/upload-artifact@v4
        with:
          name: MultiClone-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
