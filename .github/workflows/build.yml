name: Build cloner APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out NewBlackbox
        uses: actions/checkout@v4
        with:
          repository: ALEX5402/NewBlackbox
          ref: main
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install SDK, build tools, NDK and CMake
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;29.0.13846066" "cmake;3.22.1"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: cloner-apks
          path: "**/build/outputs/apk/**/*.apk"
          if-no-files-found: error
